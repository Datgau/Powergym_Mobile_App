name: powergym_mobile_app
description: "PowerGym Mobile App - Fitness & Training Management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0
  
  # State Management
  provider: ^6.1.2
  
  # Storage
  shared_preferences: ^2.3.2
  
  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.1.2
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Image
  cached_network_image: ^3.4.1
  
  # Utils
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
